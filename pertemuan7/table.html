<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel</title>
    <style>
       td,
       th {
         border: 1px solid black;
         padding: 10px
       }

       th {
        background-color: green;
        color: beige;
        border: 1px solid rgb(50, 130, 50);
       }

       table {
         border-collapse: collapse;
         font-family: Arial, Helvetica, sans-serif;
       }

       tbody>trr {
        cursor: pointer;
       }

       tbody>tr:hover {
        background-color: #e88585;
        color: rgb(277, 277, 277);
       }

       tfoot  td {
        text-align: center;
       }

       tr:nth-child(ood) {
        background-color: #c8c8c8;
       }

    </style>
</head>
<body>
  <table>
    <caption> Tabel Mahasiswa</caption>
    <thead>
        <tr>
            <th rowspan="2">No</th>
            <th rowspan="2">NIM</th>
            <th rowspan="3">Mahasiswa</th>
        </tr>
        <tr>
            <th>Prodi</th>
            <th>Alamat</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>1</td>
            <td>2402011012</td>
            <td>Gita angriany</td>
            <td>teknik informatika</td>
            <td>muaro bungo</td>
        </tr>
        <tr>
             <td>2</td>
             <td>2402011011</td>
             <td>fratiwi eky wahyuni</td>
             <td>teknik informatika</td>
             <td>tebo</td>
    </tr>
    <tr>
             <td>3</td>
             <td>2402011010</td>
             <td>desinta yunika</td>
             <td>teknik informatika</td>
             <td>m.bungo</td>
    </tr>
    </tbody>
    <tfoot>
    <tr>
        <td colspan="4"> Jumlah </td>
        <td>3</td>
    </tr>
    </tfoot>
    
</body>
</html>
